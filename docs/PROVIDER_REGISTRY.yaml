# PROVIDER_REGISTRY.yaml — Kotaru
# Regla: una entrada nace enabled: false. Nada se habilita sin verified_at,
# pricing_source oficial y commercial_audio_rights distinto de UNKNOWN.
# Entidad contratante: Estados Unidos (D-001).

meta:
  contracting_entity: US
  last_review: 2026-09-17
  currency: USD

