<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kotaru · escenarios</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14111c; color: #ece8f4; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .intro { color: #b3abc4; margin: 0 0 24px; }
  #escenarios { display: grid; gap: 28px; }
  .card h2 { font-size: 18px; margin: 0 0 8px; }
  .card canvas { display: block; border-radius: 24px; background: #221d2e; max-width: 100%; }
  .card p { color: #b3abc4; margin: 8px 0 0; }
  .card .status { font-size: 14px; }
  .card button { margin-top: 10px; font: inherit; color: #ece8f4; background: #2b2540; border: 1px solid #5b4f86; border-radius: 999px; padding: 6px 18px; cursor: pointer; }
  .card button:focus-visible { outline: 2px solid #9fb4ff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Escenarios de los personajes</h1>
  <p class="intro">Muestra de los fondos de ambientación. En la app aparecen detrás del personaje en la pantalla de conversación. Con «Hablar» se ve al personaje mover la boca como cuando te habla (sin sonido).</p>
  <div id="escenarios"></div>
</main>
<script src="app.js"></script>
</body>
</html>
